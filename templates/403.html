<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access denied · Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <style>
    body.auth {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-page, #f1f3f4);
      font-family: 'Google Sans', system-ui, sans-serif;
      color: var(--text, #202124); text-align: center;
    }
    .deny { max-width: 420px; padding: 32px; }
    .deny .material-icons { font-size: 56px; color: var(--google-red, #d93025); }
    .deny h1 { font-size: 22px; margin: 12px 0 6px; }
    .deny p { color: var(--text2, #5f6368); font-size: 14px; margin: 0 0 20px; }
    .deny a {
      display: inline-block; padding: 9px 20px; font-size: 14px; font-weight: 500;
      color: #fff; background: var(--google-blue, #1a73e8); text-decoration: none;
      border-radius: var(--radius-pill, 999px);
    }
  </style>
</head>
<body class="auth">
  <div class="deny">
    <span class="material-icons">lock</span>
    <h1>Access denied</h1>
    <p>
      You are signed in as <strong>{{ current_user.username }}</strong>
      (role: <strong>{{ current_role or 'none' }}</strong>),
      but this action requires the <strong>{{ need }}</strong> role.
    </p>
    <a href="{{ url_for('views.index') }}">Back to the map</a>
  </div>
</body>
</html>

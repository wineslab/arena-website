# Arena database — PostgreSQL in Docker.
#
#   docker compose up -d        # start the DB (creates the `arena-pgdata` volume)
#   docker compose ps           # check health
#   docker compose logs -f db   # tail logs
#   docker compose down         # stop (data persists in the volume)
#   docker compose down -v      # stop AND wipe the data volume
#
# The Flask app connects via DATABASE_URL in .env:
#   postgresql+psycopg2://arena:arena@localhost:5432/arena
#
# Credentials are local-dev defaults; override with POSTGRES_* env vars if you
# expose this beyond localhost.
services:
  db:
    image: postgres:16
    container_name: arena-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena}
      POSTGRES_DB:       ${POSTGRES_DB:-arena}
    ports:
      - "5432:5432"
    volumes:
      - arena-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arena} -d ${POSTGRES_DB:-arena}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  arena-pgdata:
